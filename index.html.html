      function renderTopics(lang) {
        const data = translations[lang];
        if (!data) return;
        
        mainTitleEl.textContent = data.mainTitle;

        topicGrid.innerHTML = '';
        data.sections.forEach(section => {
          const card = document.createElement('div');
          card.className = 'card';
          card.setAttribute('data-topic', section.id);
          card.innerHTML = `
            <div class="card-icon">
              <i class="fas ${section.icon}"></i>
            </div>
            <div class="card-content">
              <h3>${section.title}</h3>
              <p><i class="fas fa-arrow-right-circle" style="font-size:0.8rem;"></i> ${section.desc}</p>
            </div>
          `;
          card.addEventListener('click', () => {
            openGallery(section.id, section.title);
          });
          topicGrid.appendChild(card);
        });
      }

      function openGallery(topicId, topicTitle) {
        let images = imageFiles[topicId]?.[currentLang] || [];
        if (images.length === 0) {
          images = imageFiles[topicId]?.en || [];
        }

        galleryTitle.textContent = topicTitle;
        imageGallery.innerHTML = '';

            imageGallery.appendChild(img);
          });
        }

        galleryPage.classList.add('active');
        window.scrollTo(0, 0);
      }

        galleryPage.classList.remove('active');
